;
; Filet de sécurité pour les erreurs survenant avant que WordPress ne prenne la main
; sur display_errors (wp_debug_mode). Toute sortie émise avant les en-têtes HTTP
; empêche l'envoi des cookies, donc la connexion à /wp-admin.
display_errors = Off
log_errors = On
